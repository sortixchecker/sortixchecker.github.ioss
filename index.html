<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tonixker Login/Register</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg-image"></div>

<div class="login-card">
  <h1 class="title">TonixCloud</h1>

  <!-- Toggle tabs -->
  <div class="tabs">
    <button id="t-login" class="tab active" onclick="show('login')">Login</button>
    <button id="t-register" class="tab" onclick="show('register')">Register</button>
  </div>

  <!-- LOGIN -->
  <div id="login" class="form-container">
    <input id="l-user" placeholder="Username">
    <input id="l-pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <!-- REGISTER -->
  <div id="register" class="form-container hidden">
    <input id="r-user" placeholder="Username">
    <input id="r-pass" type="password" placeholder="Password">
    <button onclick="register()">Register</button>
  </div>

  <p id="msg"></p>
</div>

<script type="module">
import { show, register, login } from "./app.js";
window.show = show;
window.register = register;
window.login = login;
</script>

</body>
</html>
